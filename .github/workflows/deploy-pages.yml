name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The real-browser suite runs in the .githooks/pre-push hook, not here: it needs a
      # Chrome install and about twenty minutes of runner time, which it spent standing
      # between a push and the published site.
      - name: Run the deployment quality gate and build the site
        run: npm run check:ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the generated website
        id: deployment
        uses: actions/deploy-pages@v4
