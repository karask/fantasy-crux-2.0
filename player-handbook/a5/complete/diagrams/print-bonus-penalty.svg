', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#171c1d"><tspan x="156" y="54.36">Both succeed. Higher</tspan><tspan x="156" y="73.21">is better: +1B keeps</tspan><tspan x="156" y="92.06">65; -1P keeps 25.</tspan></text><rect x="315" y="2" width="161" height="123.4" rx="5" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.5"/><path d="M315.75 7.75a5 5 0 0 1 5 -5h149.5a5 5 0 0 1 5 5v22.25h-159.5z" fill="#1c2325"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#f4efe5" letter-spacing="0.98"><tspan x="327" y="20.76">SKILL 60%</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#171c1d"><tspan x="327" y="54.36">65 fails. Success</tspan><tspan x="327" y="73.21">beats failure: +1B</tspan><tspan x="327" y="92.06">keeps 25; -1P keeps</tspan><tspan x="327" y="110.91">65.</tspan></text>
