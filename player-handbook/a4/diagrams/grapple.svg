<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 318" width="480" height="318"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b2018"/></marker></defs><rect x="0" y="0" width="230" height="92" rx="5" fill="#f3ead6" stroke="#2b2018" stroke-width="1.4"/><path d="M0 24 V5 a5 5 0 0 1 5 -5 H225 a5 5 0 0 1 5 5 V24 Z" fill="#2b2018"/><text x="10" y="16.5" font-family="Cinzel" font-size="13" font-weight="700" fill="#f3ead6" text-anchor="start" letter-spacing="1">1 · SEIZE</text><text x="10" y="44.0" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">Combat Action.</text><text x="10" y="62.599999999999994" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">Roll Unarmed Combat.</text><rect x="250" y="0" width="230" height="92" rx="5" fill="#f3ead6" stroke="#2b2018" stroke-width="1.4"/><path d="M250 24 V5 a5 5 0 0 1 5 -5 H475 a5 5 0 0 1 5 5 V24 Z" fill="#a07a35"/><text x="260" y="16.5" font-family="Cinzel" font-size="13" font-weight="700" fill="#f3ead6" text-anchor="start" letter-spacing="1">2 · TARGET DEFENDS</text><text x="260" y="44.0" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">Dodge or Parry (one Reaction),</text><text x="260" y="62.599999999999994" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">or you just need a success.</text><line x1="230" y1="46" x2="248" y2="46" stroke="#2b2018" stroke-width="1.6" marker-end="url(#ah)"/><line x1="365" y1="92" x2="365" y2="112" stroke="#2b2018" stroke-width="1.6" marker-end="url(#ah)"/><text x="372" y="108" font-family="EB Garamond" font-size="13" font-weight="400" fill="#2b2018" text-anchor="start" font-style="italic">you win</text><rect x="0" y="114" width="230" height="110" rx="5" fill="#efd2c4" stroke="#2b2018" stroke-width="1.4"/><path d="M0 138 V119 a5 5 0 0 1 5 -5 H225 a5 5 0 0 1 5 5 V138 Z" fill="#7b2a1a"/><text x="10" y="130.5" font-family="Cinzel" font-size="13" font-weight="700" fill="#f3ead6" text-anchor="start" letter-spacing="1">NO HOLD</text><text x="10" y="158.0" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">Your hands stay free.</text><text x="10" y="176.6" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">Beaten by a weapon Parry:</text><text x="10" y="195.2" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">you take 1 HP, no armour.</text><path d="M300 92 V100 H115 V112" fill="none" stroke="#7b2a1a" stroke-width="1.6" marker-end="url(#ah)"/><text x="150" y="108" font-family="EB Garamond" font-size="13" font-weight="400" fill="#7b2a1a" text-anchor="start" font-style="italic">you lose</text><rect x="250" y="114" width="230" height="110" rx="5" fill="#d5e0e0" stroke="#2b2018" stroke-width="1.4"/><path d="M250 138 V119 a5 5 0 0 1 5 -5 H475 a5 5 0 0 1 5 5 V138 Z" fill="#2c4c55"/><text x="260" y="130.5" font-family="Cinzel" font-size="13" font-weight="700" fill="#f3ead6" text-anchor="start" letter-spacing="1">3 · HOLD</text><text x="260" y="158.0" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">Nobody takes Movement.</text><text x="260" y="176.6" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">Both −1P on every test.</text><text x="260" y="195.2" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">Fight only unarmed or with</text><text x="260" y="213.8" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">a Light one-handed weapon.</text><line x1="365" y1="224" x2="365" y2="244" stroke="#2b2018" stroke-width="1.6" marker-end="url(#ah)"/><rect x="0" y="246" width="480" height="70" rx="5" fill="#f3ead6" stroke="#2b2018" stroke-width="1.4"/><path d="M0 270 V251 a5 5 0 0 1 5 -5 H475 a5 5 0 0 1 5 5 V270 Z" fill="#2b2018"/><text x="10" y="262.5" font-family="Cinzel" font-size="13" font-weight="700" fill="#f3ead6" text-anchor="start" letter-spacing="1">4 · ESCAPE OR RELEASE</text><text x="10" y="290.0" font-family="EB Garamond" font-size="15.5" font-weight="400" fill="#2b2018" text-anchor="start">Held: Combat Action, win Unarmed vs Unarmed.  Holder: let go on your turn.</text></svg>