<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 132" width="480" height="132"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b2018"/></marker></defs><rect x="6" y="6" width="108" height="30" rx="15" fill="#f3ead6" stroke="#2b2018" stroke-width="1.2"/><text x="60" y="27" font-family="Cinzel" font-size="13" font-weight="700" fill="#2b2018" text-anchor="middle" letter-spacing="1">LIGHT</text><line x1="114" y1="21" x2="126" y2="21" stroke="#2b2018" stroke-width="1.6" marker-end="url(#ah)"/><rect x="126" y="6" width="108" height="30" rx="15" fill="#e4d6b6" stroke="#2b2018" stroke-width="1.2"/><text x="180" y="27" font-family="Cinzel" font-size="13" font-weight="700" fill="#2b2018" text-anchor="middle" letter-spacing="1">MEDIUM</text><line x1="234" y1="21" x2="246" y2="21" stroke="#2b2018" stroke-width="1.6" marker-end="url(#ah)"/><rect x="246" y="6" width="108" height="30" rx="15" fill="#d9c49b" stroke="#2b2018" stroke-width="1.2"/><text x="300" y="27" font-family="Cinzel" font-size="13" font-weight="700" fill="#2b2018" text-anchor="middle" letter-spacing="1">HEAVY</text><line x1="354" y1="21" x2="366" y2="21" stroke="#2b2018" stroke-width="1.6" marker-end="url(#ah)"/><rect x="366" y="6" width="108" height="30" rx="15" fill="#c9ad7c" stroke="#2b2018" stroke-width="1.2"/><text x="420" y="27" font-family="Cinzel" font-size="13" font-weight="700" fill="#2b2018" text-anchor="middle" letter-spacing="1">HUGE</text><text x="0" y="64" font-family="EB Garamond" font-size="15" font-weight="400" fill="#2b2018" text-anchor="start" font-style="italic">Your parrying item compared with the attacking weapon:</text><rect x="0" y="74" width="152" height="54" rx="5" fill="#d5e0e0" stroke="#2c4c55" stroke-width="1.2"/><text x="76" y="96" font-family="EB Garamond" font-size="14.5" font-weight="400" fill="#2b2018" text-anchor="middle">Same Size or larger</text><text x="76" y="118" font-family="Cinzel" font-size="15" font-weight="700" fill="#2c4c55" text-anchor="middle">blocks ALL</text><rect x="160" y="74" width="152" height="54" rx="5" fill="#ecd9a8" stroke="#2b2018" stroke-width="1.2"/><text x="236" y="96" font-family="EB Garamond" font-size="14.5" font-weight="400" fill="#2b2018" text-anchor="middle">One Size smaller</text><text x="236" y="118" font-family="Cinzel" font-size="15" font-weight="700" fill="#2b2018" text-anchor="middle">blocks HALF</text><rect x="320" y="74" width="152" height="54" rx="5" fill="#efd2c4" stroke="#7b2a1a" stroke-width="1.2"/><text x="396" y="96" font-family="EB Garamond" font-size="14.5" font-weight="400" fill="#2b2018" text-anchor="middle">Two or more smaller</text><text x="396" y="118" font-family="Cinzel" font-size="15" font-weight="700" fill="#7b2a1a" text-anchor="middle">blocks NONE</text></svg>