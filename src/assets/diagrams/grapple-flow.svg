<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 574.5" width="420" height="574.5">
<rect x="14" y="6" width="392" height="87" rx="5" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.5"/><path d="M14.75 11.75a5 5 0 0 1 5 -5h380.5a5 5 0 0 1 5 5v22.25h-390.5z" fill="#1c2325"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#f4efe5" letter-spacing="0.98"><tspan x="26" y="24.76">1 · SEIZE</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="58.85">Spend a Combat Action. Commit one or two limbs, then</tspan><tspan x="26" y="78.35">roll Unarmed Combat.</tspan></text><polyline points="210,93 210,105" fill="none" stroke="#171c1d" stroke-width="1.6" stroke-linejoin="round"/><polygon points="210,113 214.4,105 205.6,105" fill="#171c1d"/><rect x="14" y="113" width="392" height="87" rx="5" fill="#f1e6c6" stroke="#8a6d22" stroke-width="1.5"/><path d="M14.75 118.75a5 5 0 0 1 5 -5h380.5a5 5 0 0 1 5 5v22.25h-390.5z" fill="#8a6d22"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.98"><tspan x="26" y="131.76">2 · TARGET DEFENDS</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="165.85">It can spend one Reaction to Dodge or Parry as an</tspan><tspan x="26" y="185.35">opposed test. With no defence, you roll unopposed.</tspan></text><polyline points="132,200 132,226" fill="none" stroke="#171c1d" stroke-width="1.6" stroke-linejoin="round"/><polygon points="132,234 136.4,226 127.6,226" fill="#171c1d"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="12.5" font-weight="700" fill="#171c1d" letter-spacing="1"><tspan x="140" y="217.44">YOU WIN</tspan></text><polyline points="334,200 334,226" fill="none" stroke="#a73e29" stroke-width="1.6" stroke-linejoin="round"/><polygon points="334,234 338.4,226 329.6,226" fill="#a73e29"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="12.5" font-weight="700" fill="#a73e29" letter-spacing="1"><tspan x="342" y="217.44">YOU LOSE</tspan></text><rect x="14" y="234" width="236" height="165" rx="5" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.5"/><path d="M14.75 239.75a5 5 0 0 1 5 -5h224.5a5 5 0 0 1 5 5v22.25h-234.5z" fill="#1c2325"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#f4efe5" letter-spacing="0.98"><tspan x="26" y="252.76">3 · HOLD</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="286.85">You are the controller. Neither</tspan><tspan x="26" y="306.35">of you can take a Movement</tspan><tspan x="26" y="325.85">Action. Both take -1P on every</tspan><tspan x="26" y="345.35">test and fight only unarmed or</tspan><tspan x="26" y="364.85">with a Light one-handed</tspan><tspan x="26" y="384.35">weapon.</tspan></text><rect x="262" y="234" width="144" height="118.2" rx="5" fill="#f3dcd3" stroke="#a73e29" stroke-width="1.5"/><path d="M262.75 239.75a5 5 0 0 1 5 -5h132.5a5 5 0 0 1 5 5v22.25h-142.5z" fill="#a73e29"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.98"><tspan x="274" y="252.76">NO HOLD</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171c1d"><tspan x="274" y="285.36">A successful</tspan><tspan x="274" y="302.91">weapon Parry that</tspan><tspan x="274" y="320.46">wins deals you 1 HP,</tspan><tspan x="274" y="338.02">ignoring AP.</tspan></text><polyline points="132,399 132,411" fill="none" stroke="#171c1d" stroke-width="1.6" stroke-linejoin="round"/><polygon points="132,419 136.4,411 127.6,411" fill="#171c1d"/><rect x="14" y="419" width="392" height="149.5" rx="5" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.5"/><path d="M14.75 424.75a5 5 0 0 1 5 -5h380.5a5 5 0 0 1 5 5v22.25h-390.5z" fill="#1c2325"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#f4efe5" letter-spacing="0.98"><tspan x="26" y="437.76">4 · ESCAPE OR RELEASE</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="471.85">The held participant spends a Combat Action and wins</tspan><tspan x="26" y="491.35">an opposed Unarmed Combat test. Opposing it costs</tspan><tspan x="26" y="510.85">no Reaction.</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="534.35">The controller can release the grapple freely on their</tspan><tspan x="26" y="553.85">own turn.</tspan></text>
</svg>
