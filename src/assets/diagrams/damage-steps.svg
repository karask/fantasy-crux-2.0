<rect x="14" y="6" width="262" height="87" rx="5" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.5"/><path d="M14.75 11.75a5 5 0 0 1 5 -5h250.5a5 5 0 0 1 5 5v22.25h-260.5z" fill="#1c2325"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#f4efe5" letter-spacing="0.98"><tspan x="26" y="24.76">1 · ROLL DAMAGE</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="58.85">Weapon dice, plus DM and any</tspan><tspan x="26" y="78.35">extra dice.</tspan></text><polyline points="145,93 145,105" fill="none" stroke="#171c1d" stroke-width="1.6" stroke-linejoin="round"/><polygon points="145,113 149.4,105 140.6,105" fill="#171c1d"/><rect x="14" y="113" width="262" height="87" rx="5" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.5"/><path d="M14.75 118.75a5 5 0 0 1 5 -5h250.5a5 5 0 0 1 5 5v22.25h-260.5z" fill="#1c2325"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#f4efe5" letter-spacing="0.98"><tspan x="26" y="131.76">2 · PARRY</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="165.85">A winning Parry blocks all, half, or</tspan><tspan x="26" y="185.35">none, by Size.</tspan></text><polyline points="145,200 145,212" fill="none" stroke="#171c1d" stroke-width="1.6" stroke-linejoin="round"/><polygon points="145,220 149.4,212 140.6,212" fill="#171c1d"/><rect x="14" y="220" width="262" height="67.5" rx="5" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.5"/><path d="M14.75 225.75a5 5 0 0 1 5 -5h250.5a5 5 0 0 1 5 5v22.25h-260.5z" fill="#1c2325"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#f4efe5" letter-spacing="0.98"><tspan x="26" y="238.76">3 · ARMOUR</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="272.85">Subtract Armour Points (AP).</tspan></text><polyline points="145,287.5 145,299.5" fill="none" stroke="#171c1d" stroke-width="1.6" stroke-linejoin="round"/><polygon points="145,307.5 149.4,299.5 140.6,299.5" fill="#171c1d"/><rect x="14" y="307.5" width="262" height="87" rx="5" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.5"/><path d="M14.75 313.25a5 5 0 0 1 5 -5h250.5a5 5 0 0 1 5 5v22.25h-260.5z" fill="#1c2325"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#f4efe5" letter-spacing="0.98"><tspan x="26" y="326.26">4 · VITALITY RESERVE</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="360.35">If the target has one, it absorbs</tspan><tspan x="26" y="379.85">damage next.</tspan></text><polyline points="145,394.5 145,406.5" fill="none" stroke="#171c1d" stroke-width="1.6" stroke-linejoin="round"/><polygon points="145,414.5 149.4,406.5 140.6,406.5" fill="#171c1d"/><rect x="14" y="414.5" width="262" height="87" rx="5" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.5"/><path d="M14.75 420.25a5 5 0 0 1 5 -5h250.5a5 5 0 0 1 5 5v22.25h-260.5z" fill="#1c2325"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#f4efe5" letter-spacing="0.98"><tspan x="26" y="433.26">5 · LOSE HP</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="467.35">Lose what is left. HP never drops</tspan><tspan x="26" y="486.85">below 0.</tspan></text><rect x="292" y="113" width="114" height="118.2" rx="5" fill="#f1e6c6" stroke="#8a6d22" stroke-width="1.5"/><path d="M292.75 118.75a5 5 0 0 1 5 -5h102.5a5 5 0 0 1 5 5v22.25h-112.5z" fill="#8a6d22"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.98"><tspan x="304" y="131.76">CRITICAL</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171c1d"><tspan x="304" y="164.37">Maximum</tspan><tspan x="304" y="181.92">damage. Skips</tspan><tspan x="304" y="199.47">Parry and</tspan><tspan x="304" y="217.02">armour.</tspan></text><polyline points="276,22 349,22 349,105" fill="none" stroke="#8a6d22" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 3"/><polygon points="349,113 353.4,105 344.6,105" fill="#8a6d22"/><polyline points="349,231.2 349,323.5 284,323.5" fill="none" stroke="#8a6d22" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 3"/><polygon points="276,323.5 284,327.9 284,319.1" fill="#8a6d22"/><polyline points="145,501.5 145,511.5 109,511.5 109,521.5" fill="none" stroke="#a73e29" stroke-width="1.6" stroke-linejoin="round"/><polygon points="109,529.5 113.4,521.5 104.6,521.5" fill="#a73e29"/><polyline points="145,511.5 311,511.5 311,521.5" fill="none" stroke="#a73e29" stroke-width="1.6" stroke-linejoin="round"/><polygon points="311,529.5 315.4,521.5 306.6,521.5" fill="#a73e29"/><rect x="14" y="529.5" width="190" height="87" rx="5" fill="#f3dcd3" stroke="#a73e29" stroke-width="1.5"/><path d="M14.75 535.25a5 5 0 0 1 5 -5h178.5a5 5 0 0 1 5 5v22.25h-188.5z" fill="#a73e29"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.98"><tspan x="26" y="548.26">ONE HIT ≥ MWL</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="26" y="582.35">Major Wound: Wounded</tspan><tspan x="26" y="601.85">and Bleeding.</tspan></text><rect x="216" y="529.5" width="190" height="87" rx="5" fill="#f3dcd3" stroke="#a73e29" stroke-width="1.5"/><path d="M216.75 535.25a5 5 0 0 1 5 -5h178.5a5 5 0 0 1 5 5v22.25h-188.5z" fill="#a73e29"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.98"><tspan x="228" y="548.26">AT 0 HP</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="400" fill="#171c1d"><tspan x="228" y="582.35">Unconscious and Dying.</tspan></text>
