<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 219.1" width="420" height="219.1">
<text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#171c1d" letter-spacing="0.98"><tspan x="14" y="16.81">SKILL 60%</tspan></text><rect x="14" y="34" width="49" height="44" rx="3" fill="#2c6a83" stroke="#2c6a83" stroke-width="1.4"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle"><tspan x="38.5" y="51.44">CRITICAL</tspan></text><text font-family="'IBM Plex Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle"><tspan x="38.5" y="67.9">01–06</tspan></text><rect x="66" y="34" width="165" height="44" rx="3" fill="#dbe9ee" stroke="#2c6a83" stroke-width="1.4"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#171c1d" letter-spacing="0.98" text-anchor="middle"><tspan x="148.5" y="52.81">SUCCESS</tspan></text><text font-family="'IBM Plex Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#4d5857" text-anchor="middle"><tspan x="148.5" y="67.9">07–60</tspan></text><rect x="234" y="34" width="117" height="44" rx="3" fill="#f4efe5" stroke="#b7ad9b" stroke-width="1.4"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#171c1d" letter-spacing="0.98" text-anchor="middle"><tspan x="292.5" y="52.81">FAILURE</tspan></text><text font-family="'IBM Plex Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#4d5857" text-anchor="middle"><tspan x="292.5" y="67.9">61–98</tspan></text><rect x="354" y="34" width="49" height="44" rx="3" fill="#a73e29" stroke="#a73e29" stroke-width="1.4"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle"><tspan x="378.5" y="51.44">FUMBLE</tspan></text><text font-family="'IBM Plex Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle"><tspan x="378.5" y="67.9">99–00</tspan></text><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="12.5" font-weight="700" fill="#4d5857" letter-spacing="1"><tspan x="14" y="113.44">READ THE DICE</tspan></text><polygon points="38,123 52.62,136.94 38,157 23.38,136.94" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.6" stroke-linejoin="round"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="17" font-weight="700" fill="#171c1d" letter-spacing="0.17" text-anchor="middle"><tspan x="38" y="148.84">5</tspan></text><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="12.5" font-weight="700" fill="#4d5857" letter-spacing="1" text-anchor="middle"><tspan x="38" y="169.44">TENS</tspan></text><polygon points="88,123 102.62,136.94 88,157 73.38,136.94" fill="#f8f4ec" stroke="#171c1d" stroke-width="1.6" stroke-linejoin="round"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="17" font-weight="700" fill="#171c1d" letter-spacing="0.17" text-anchor="middle"><tspan x="88" y="148.84">9</tspan></text><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="12.5" font-weight="700" fill="#4d5857" letter-spacing="1" text-anchor="middle"><tspan x="88" y="169.44">UNITS</tspan></text><polyline points="114,140 132,140" fill="none" stroke="#171c1d" stroke-width="1.6" stroke-linejoin="round"/><polygon points="140,140 132,135.6 132,144.4" fill="#171c1d"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="28" font-weight="700" fill="#171c1d" letter-spacing="0.28"><tspan x="148" y="150.62">59</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="15" font-weight="700" fill="#171c1d"><tspan x="184" y="144.85">Success at 60%</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4d5857"><tspan x="14" y="191.37">A tens die of 0 gives one digit, such as 07. Double zero reads</tspan><tspan x="14" y="208.92">100.</tspan></text>
