<text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#171c1d" letter-spacing="0.98"><tspan x="14" y="14.81">INT 13 = YOUR ACTIVE MAGNITUDE LIMIT</tspan></text><rect x="16" y="46" width="325" height="46" rx="3" fill="#f8f4ec" stroke="#171c1d" stroke-width="2"/><rect x="18" y="49" width="96" height="40" rx="2" fill="#dbe9ee" stroke="#2c6a83" stroke-width="1.2"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#171c1d" letter-spacing="0.98" text-anchor="middle"><tspan x="66" y="64.81">WARD</tspan></text><text font-family="'IBM Plex Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#4d5857" text-anchor="middle"><tspan x="66" y="81.81">M4</tspan></text><rect x="118" y="49" width="96" height="40" rx="2" fill="#f1e6c6" stroke="#8a6d22" stroke-width="1.2"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#171c1d" letter-spacing="0.98" text-anchor="middle"><tspan x="166" y="64.81">FLIGHT</tspan></text><text font-family="'IBM Plex Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#4d5857" text-anchor="middle"><tspan x="166" y="81.81">M4</tspan></text><rect x="218" y="49" width="96" height="40" rx="2" fill="#f4efe5" stroke="#b7ad9b" stroke-width="1.2"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#171c1d" letter-spacing="0.98" text-anchor="middle"><tspan x="266" y="64.81">SUMMON</tspan></text><text font-family="'IBM Plex Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#4d5857" text-anchor="middle"><tspan x="266" y="81.81">M4</tspan></text><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="12.5" font-weight="700" fill="#2c6a83" letter-spacing="1" text-anchor="end"><tspan x="316" y="109.44">12 USED</tspan></text><polyline points="341,28 341,164" fill="none" stroke="#a73e29" stroke-width="2"/><text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="12.5" font-weight="700" fill="#a73e29" letter-spacing="1" text-anchor="middle"><tspan x="341" y="27.44">LIMIT 13</tspan></text><rect x="318" y="122" width="71" height="38" rx="2" fill="#f3dcd3" stroke="#a73e29" stroke-width="1.5" stroke-dasharray="5 3"/><text font-family="'IBM Plex Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#a73e29" text-anchor="middle"><tspan x="353.5" y="143.81">+M3</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a73e29"><tspan x="16" y="135.37">Another ongoing M3 would make 15: too much.</tspan><tspan x="16" y="152.92">Dismiss one Shaping first.</tspan></text><text font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4d5857"><tspan x="16" y="187.37">Instant Shapings, such as a firebolt, end at once and count</tspan><tspan x="16" y="204.92">nothing.</tspan></text>
